name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v1
        with:
          version: 12
          runtime: node@24

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm build
